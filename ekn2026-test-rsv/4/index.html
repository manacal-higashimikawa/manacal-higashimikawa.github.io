<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>4回コース空き状況｜豊橋駅西校 サマースクール2026</title>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      background: #f5fbff;
      color: #1f2d3d;
      line-height: 1.7;
    }

    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    .hero {
      background: linear-gradient(135deg, #e5f6ff, #fff5cc);
      border: 2px solid #d8eefc;
      border-radius: 20px;
      padding: 20px 14px;
      text-align: center;
      margin-bottom: 16px;
    }

    .school {
      display: inline-block;
      background: #ffffff;
      color: #005bac;
      font-weight: 800;
      font-size: 14px;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.35;
      color: #005bac;
      font-weight: 900;
    }

    .course {
      margin: 0;
      font-size: 18px;
      color: #168a3a;
      font-weight: 900;
    }

    .notice {
      background: #ffffff;
      border: 1px solid #e0e6ef;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .slot {
      background: #ffffff;
      border: 1px solid #dfe8f3;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }

    .status {
      display: inline-block;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .ok {
      background: #e8f8ee;
      color: #168a3a;
    }

    .few {
      background: #fff4cf;
      color: #a66d00;
    }

    .full {
      background: #eeeeee;
      color: #777777;
    }

    .date {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 2px;
    }

    .time {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      border: none;
      display: block;
      text-align: center;
      text-decoration: none;
      background: #06c755;
      color: #ffffff;
      font-weight: 900;
      font-size: 16px;
      padding: 12px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
    }

    .btn.secondary {
      background: #005bac;
    }

    .btn.disabled {
      background: #bbbbbb;
      pointer-events: none;
      cursor: not-allowed;
    }

    .form {
      background: #ffffff;
      border: 2px solid #d8eefc;
      border-radius: 18px;
      padding: 16px;
      margin: 18px 0;
      display: none;
    }

    .form.active {
      display: block;
    }

    .selected {
      background: #e8f8ee;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      font-weight: 800;
      color: #168a3a;
    }

    label {
      display: block;
      font-weight: 800;
      margin: 12px 0 6px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ccd6e0;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      font-family: inherit;
      background: #ffffff;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    .small {
      font-size: 13px;
      color: #555555;
      margin-top: 10px;
    }

    .error {
      display: none;
      background: #fff0f0;
      color: #b00020;
      border: 1px solid #ffd1d1;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .error.active {
      display: block;
    }

    .loading {
      background: #ffffff;
      border: 1px solid #dfe8f3;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #555555;
    }

    .loading.ok {
      color: #168a3a;
    }

    .loading.ng {
      color: #b00020;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero">
      <div class="school">豊橋駅西校</div>
      <h1>東三河こどもプログラミング<br>サマースクール2026</h1>
      <p class="course">4回コース 空き状況</p>
    </section>

    <div id="liffStatus" class="loading">
      LINE連携を確認しています...
    </div>

    <section class="notice">
      初回希望日を選んでください。<br>
      必要事項を入力後、LINEトークに申込み内容を送信できます。<br>
      この時点では予約確定ではありません。担当者からの返信をもって予約確定となります。
    </section>

    <div id="error" class="error"></div>

    <section class="slot">
      <div class="status ok">○ 空きあり</div>
      <div class="date">7月22日（水）</div>
      <div class="time">14:00〜16:00</div>
      <button class="btn" onclick="selectSlot('7月22日（水）14:00〜16:00')">
        この日で申し込む
      </button>
    </section>

    <section class="slot">
      <div class="status ok">○ 空きあり</div>
      <div class="date">7月24日（金）</div>
      <div class="time">14:00〜16:00</div>
      <button class="btn" onclick="selectSlot('7月24日（金）14:00〜16:00')">
        この日で申し込む
      </button>
    </section>

    <section class="slot">
      <div class="status few">△ 残りわずか</div>
      <div class="date">7月29日（水）</div>
      <div class="time">14:00〜16:00</div>
      <button class="btn" onclick="selectSlot('7月29日（水）14:00〜16:00')">
        この日で申し込む
      </button>
    </section>

    <section class="slot">
      <div class="status full">× 満席</div>
      <div class="date">7月31日（金）</div>
      <div class="time">14:00〜16:00</div>
      <button class="btn disabled" disabled>
        満席です
      </button>
    </section>

    <section id="formArea" class="form">
      <div id="selectedDate" class="selected"></div>

      <label for="parentName">保護者氏名</label>
      <input id="parentName" type="text" placeholder="例：山田 太郎">

      <label for="childName">お子さま氏名</label>
      <input id="childName" type="text" placeholder="例：山田 花子">

      <label for="grade">学年</label>
      <input id="grade" type="text" placeholder="例：小学3年生">

      <label for="phone">電話番号</label>
      <input id="phone" type="tel" placeholder="例：090-0000-0000">

      <label for="note">質問・連絡事項</label>
      <textarea id="note" placeholder="ご質問などがあればご入力ください"></textarea>

      <button class="btn secondary" style="margin-top:16px;" onclick="sendApplication()">
        この内容でLINEに送信
      </button>

      <div class="small">
        送信後、担当者からの返信をもって予約確定となります。
      </div>
    </section>
  </main>

  <script>
    // ここを実際のLIFF IDに変更してください
    const LIFF_ID = "2010559372-n8iXn5Ht";

    let selectedSlot = "";
    let liffReady = false;

    function showError(message) {
      const error = document.getElementById("error");
      error.textContent = message;
      error.classList.add("active");
      error.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function clearError() {
      const error = document.getElementById("error");
      error.textContent = "";
      error.classList.remove("active");
    }

    function setLiffStatus(message, type) {
      const status = document.getElementById("liffStatus");
      status.textContent = message;
      status.className = "loading" + (type ? " " + type : "");
    }

    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });

        // if (!liff.isLoggedIn()) {
        //   liff.login();
        //   return;
        // }

        liffReady = true;

        if (liff.isInClient()) {
          setLiffStatus("LINE内で開いています。申込み内容をLINEトークに送信できます。", "ok");
        } else {
          setLiffStatus("LINE外のブラウザで開いています。テスト時はLINEアプリ内からLIFF URLを開いてください。", "ng");
        }
      } catch (e) {
        console.error(e);
        setLiffStatus("LINE連携の初期化に失敗しました。LIFF IDとLIFF URLを確認してください。", "ng");
      }
    }

    function selectSlot(slot) {
      clearError();
      selectedSlot = slot;

      document.getElementById("selectedDate").textContent =
        "選択中の初回希望日：" + selectedSlot;

      const formArea = document.getElementById("formArea");
      formArea.classList.add("active");
      formArea.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function requiredValue(id, label) {
      const value = document.getElementById(id).value.trim();
      if (!value) {
        throw new Error(label + "を入力してください。");
      }
      return value;
    }

    async function sendApplication() {
      clearError();

      try {
        if (!liffReady) {
          throw new Error("LINE連携がまだ準備できていません。LIFF URLから開いているか確認してください。");
        }

        if (!liff.isInClient()) {
          throw new Error("LINEアプリ内から開いてください。通常ブラウザではLINEトークに送信できません。");
        }

        if (!selectedSlot) {
          throw new Error("初回希望日を選択してください。");
        }

        const parentName = requiredValue("parentName", "保護者氏名");
        const childName = requiredValue("childName", "お子さま氏名");
        const grade = requiredValue("grade", "学年");
        const phone = requiredValue("phone", "電話番号");
        const note = document.getElementById("note").value.trim();

        const message =
`【サマースクール申込み希望】

教室：豊橋駅西校
希望コース：4回コース
初回希望日：${selectedSlot}

保護者氏名：${parentName}
お子さま氏名：${childName}
学年：${grade}
電話番号：${phone}
質問・連絡事項：${note || "なし"}

※担当者からの返信をもって予約確定となります。`;

        await liff.sendMessages([
          {
            type: "text",
            text: message
          }
        ]);

        alert("申込み内容をLINEに送信しました。担当者からの返信をお待ちください。");

        liff.closeWindow();

      } catch (e) {
        console.error(e);
        showError(e.message || "送信に失敗しました。");
      }
    }

    initLiff();
  </script>
</body>
</html>
